<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="口袋AI · 个人智能助手：笔记 / OCR 识别 / 日程待办 / AI 对话">
<title>口袋AI · 个人AI助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- 顶部栏 -->
  <header id="app-header" class="app-header">
    <button id="header-back" class="header-btn" hidden aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="header-title" class="header-title">个人AI助手</h1>
    <div id="header-actions" class="header-actions"></div>
  </header>

  <!-- 视图区 -->
  <main id="view-root" class="view-root"></main>

  <!-- 底部导航 -->
  <nav id="bottom-nav" class="bottom-nav">
    <button class="nav-item" data-route="/">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5z" fill="currentColor"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" data-route="/chat">
      <svg viewBox="0 0 24 24"><path d="M21 12a8.5 8.5 0 0 1-8.5 8.5c-1.3 0-2.5-.3-3.6-.8L3 21l1.4-5.2A8.5 8.5 0 1 1 21 12z" fill="currentColor"/></svg>
      <span>对话</span>
    </button>
    <button class="nav-item" data-route="/notes">
      <svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm9 1v4h4l-4-4zm-6 8h8v2H8v-2zm0 4h8v2H8v-2z" fill="currentColor"/></svg>
      <span>笔记</span>
    </button>
    <button class="nav-item" data-route="/schedule">
      <svg viewBox="0 0 24 24"><path d="M7 3v2m10-2v2M4 8h16M5 4h14a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm2 8h3v3H7v-3zm5 0h5v3h-5v-3z" fill="currentColor"/></svg>
      <span>日程</span>
    </button>
    <button class="nav-item" data-route="/settings">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm8.5 4c0-.6 0-1.2-.1-1.8l1.8-1.4-1.8-3.1-2.1.9a7.6 7.6 0 0 0-3.1-1.8L14.7 2h-5.4l-.5 2.8a7.6 7.6 0 0 0-3.1 1.8l-2.1-.9-1.8 3.1 1.8 1.4c-.1.6-.1 1.2-.1 1.8s0 1.2.1 1.8l-1.8 1.4 1.8 3.1 2.1-.9a7.6 7.6 0 0 0 3.1 1.8l.5 2.8h5.4l.5-2.8a7.6 7.6 0 0 0 3.1-1.8l2.1.9 1.8-3.1-1.8-1.4c.1-.6.1-1.2.1-1.8z" fill="currentColor"/></svg>
      <span>我的</span>
    </button>
  </nav>

  <!-- 全局 Toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- 全局确认弹窗 -->
  <div id="confirm-mask" class="mask" hidden>
    <div class="sheet confirm-sheet">
      <p id="confirm-text" class="confirm-text"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn btn-plain">取消</button>
        <button id="confirm-ok" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 通用底部弹层（表单/面板） -->
  <div id="sheet-mask" class="mask" hidden>
    <div id="sheet-body" class="sheet"></div>
  </div>

  <!-- 加载指示 -->
  <div id="loading-mask" class="mask" hidden>
    <div class="loading-box">
      <span class="spinner"></span>
      <p id="loading-text">处理中…</p>
    </div>
  </div>
</div>

<!-- OCR 引擎（浏览器端，无后端） -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script src="js/store.js"></script>
<script src="js/ai.js"></script>
<script src="js/ocr.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/chat.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/ocrview.js"></script>
<script src="js/views/schedule.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
