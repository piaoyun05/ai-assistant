<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="口袋AI · 个人智能助手：笔记 / OCR 识别 / 日程待办 / AI 对话">
<title>口袋AI · 个人AI助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- 顶部栏 -->
  <header id="app-header" class="app-header">
    <button id="header-back" class="header-btn" hidden aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="header-title" class="header-title">个人AI助手</h1>
    <div id="header-actions" class="header-actions"></div>
  </header>

  <!-- 视图区 -->
  <main id="view-root" class="view-root"></main>

  <!-- 全局 Toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- 全局确认弹窗 -->
  <div id="confirm-mask" class="mask" hidden>
    <div class="sheet confirm-sheet">
      <p id="confirm-text" class="confirm-text"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn btn-plain">取消</button>
        <button id="confirm-ok" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 通用底部弹层（表单/面板） -->
  <div id="sheet-mask" class="mask" hidden>
    <div id="sheet-body" class="sheet"></div>
  </div>

  <!-- 加载指示 -->
  <div id="loading-mask" class="mask" hidden>
    <div class="loading-box">
      <span class="spinner"></span>
      <p id="loading-text">处理中…</p>
    </div>
  </div>
</div>

<!-- OCR 引擎（浏览器端，无后端） -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script src="js/store.js"></script>
<script src="js/ai.js"></script>
<script src="js/ocr.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/chat.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/ocrview.js"></script>
<script src="js/views/schedule.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
